version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: aiva_redis
    restart: unless-stopped
    networks:
      - aiva-network
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    container_name: aiva_postgres
    restart: unless-stopped
    networks:
      - aiva-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: aiva_bot
      POSTGRES_USER: aiva_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aiva_secret}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiva_user -d aiva_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aiva_bot
    restart: unless-stopped
    env_file:
      - ../.env
    networks:
      - aiva-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - CLIENT_HASH_SALT=${CLIENT_HASH_SALT}
      - DATA_COLLECTION_ENABLED=${DATA_COLLECTION_ENABLED:-true}
      - SUBSCRIPTION_CHECK_INTERVAL=${SUBSCRIPTION_CHECK_INTERVAL:-3600}
      - API_KEY=${API_KEY:-your_api_key_here}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --forwarded-allow-ips '*'"

  nginx:
    image: nginx:alpine
    container_name: aiva_nginx
    restart: unless-stopped
    networks:
      - aiva-network
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../nginx/conf.d:/etc/nginx/conf.d
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - bot
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: aiva_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}

networks:
  aiva-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  certbot_data:
  certbot_www: