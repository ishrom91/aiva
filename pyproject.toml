[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aiva-ai-bot"
version = "1.0.0"
description = "Production-ready Telegram bot for beauty industry professionals"
authors = [{name = "Developer", email = "dev@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram~=3.4",
    "fastapi~=0.111",
    "uvicorn[standard]~=0.30",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.29",
    "alembic~=1.13",
    "redis~=5.0",
    "pydantic~=2.6",
    "pydantic-settings~=2.2",
    "structlog~=24.1",
    "cryptography",
    "python-dotenv~=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest~=8",
    "pytest-asyncio~=0.23",
    "httpx~=0.27",
    "ruff~=0.4",
    "mypy~=1.10",
    "types-python-dotenv"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
]
ignore = ["E501", "E402", "B007", "B008", "C901"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.handlers.booking",
    "src.repositories.booking_repo",
    "src.repositories.interaction_repo",
    "src.schemas.booking",
    "src.services.subscription_service",
    "src.services.booking_service",
    "src.skills.booking_skill",
    "src.skills.subscription_skill",
    "src.middlewares.event_logger",
]
ignore_errors = true